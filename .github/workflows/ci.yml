name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", "1.23.x", "1.24.x", "1.25.x", "1.26.x"]
    env:
      GOPRIVATE: github.com/justusschock/*
      GONOSUMDB: github.com/justusschock/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Configure private module access
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [ -z "$GO_MODULES_TOKEN" ]; then
            echo "GO_MODULES_TOKEN is required to resolve private modules" >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Verify module graph
        run: |
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race ./...
